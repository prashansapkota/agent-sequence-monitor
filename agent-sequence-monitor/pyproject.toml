[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seqmon"
version = "0.1.0"
description = "Detecting cumulative policy violations in autonomous AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/seqmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
